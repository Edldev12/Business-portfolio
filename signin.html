<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=0.1">
        <title>professional portfolio/sign in</title>
        <link rel="stylesheet" href="assets/style/signinstyle.css">
    </head>
    <body>
        <div class="container">
            <div class="left">
                <img src="assets/images/recent_referrals.jpg"  alt="working environment">
            </div>
            <div class="right">
                <h1>Sign In</h1>
                <form class="signin-form" action="#" method="post">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    <label class="remember-me">
                        <input type="checkbox">
                        <span class="switch"></span>
                        <span>Remember me</span>
                    </label>
                    <button type="submit">Sign In</button>
                </form>
                <div class="link-container">
                      <a href="#" class="password">Forget Password?</a>
                    <h4>don't have an accout? <a href="signup.html">Sign up</a></h4>
                </div>
                   
                </div>
            </div>
        </div>
    </body>

</html>
