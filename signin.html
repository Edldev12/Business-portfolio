<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>professional portfolio/sign in</title>
        <link rel="stylesheet" href="assets/style/signinstyle.css">
    </head>
    <body>

    <!-- =========================
         MOBILE HEADER
    ========================== -->
    <header class="mobile-header">

        <div class="menu-icon">☰</div>

        <h2>DataSync Pro</h2>

        <div class="header-icon">•••</div>

    </header>


    <!-- =========================
         MAIN CONTAINER
    ========================== -->
    <div class="container">

        <!-- LEFT IMAGE -->
        <div class="left">

            <img
                src="assets/images/recent_referrals.jpg"
                alt="Working environment"
            >

        </div>


        <!-- RIGHT SIDE -->
        <div class="right">

            <h1>Sign In</h1>

            <!-- SIGN IN FORM -->
            <form
                class="signin-form"
                action="#"
                method="post"
            >

                <label for="email">
                    Email:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password:
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >


                <!-- REMEMBER ME -->
                <label class="remember-me">

                    <input type="checkbox">

                    <span class="switch"></span>

                    <span>Remember me</span>

                </label>


                <!-- SIGN IN BUTTON -->
                <button type="submit">
                    Sign In
                </button>

            </form>


            <!-- LINKS -->
            <div class="link-container">

                <a href="#" class="password">
                    Forgot Password?
                </a>

                <h4>
                    Don't have an account?
                    <a href="signup.html">
                        Sign up
                    </a>
                </h4>

            </div>

        </div>

    </div>

</body>
