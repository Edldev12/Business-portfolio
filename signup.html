<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>professional portfolio/sign up</title>
        <link rel="stylesheet" href="assets/style/signupstyle.css">
        <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>
    </head>
    <body>
        <div class="container">

        <!-- LEFT IMAGE -->
            <div class="left">
                <img src="assets/images/global_performance_summary.jpg"  alt="working enviroment">
            </div>
            <div class="right">
                <form class="signup-form" action="#" method="post">
                    <h1>Sign Up</h1>
                    <div class="input-group"> Full Name
                        <i class="fa-regular fa-user"></i>
                        <input type="text" placeholder="Full Name">
                    </div>

                    <div class="input-group"> Email
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" placeholder="Email">
                    </div>

                    <div class="input-group"> Password
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="Password">
                        <i class="fa-regular fa-eye-slash password-icon"></i>
                    </div>
                    <button type="submit">Create Account</button>
                    <h4>Already have an account? <a href="signin.html">Sign in</a></h4>
                </form>
            </div>
        </div>
    </body>
</html>
