<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=0.1">
        <title>professional portfolio/sign up</title>
        <link rel="stylesheet" href="assets/style/signupstyle.css">
    </head>
    <body>
        <img src="assets/images/recent_referrals.jpg" width="320" height="320" alt="working enviroment">
        <section>
            <h1>Sign Up</h1>
            <form>
                <label for="name">Full Name:</label>
                <input type="name" id="name" name="name" placeholder="Enter your full name" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <label for="password">password:</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <button type="submit">Create Account</button>

            </form>
            <h4>Already have an account? <a href="signin.html">Sign in</a></h4>
        </section>
    </body>
</html>
